<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RM Trading Academy — CSV Prep</title><style>body{font:16px system-ui;background:#0b1020;color:#edf2ff;max-width:760px;margin:20px auto;padding:16px}section{background:#151d32;border:1px solid #35415c;padding:18px;border-radius:14px;margin:14px 0}input,button,textarea,select{background:#243454;color:white;border:1px solid #596783;border-radius:8px;padding:12px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:130px}a{color:#9ac4ff}pre{white-space:pre-wrap}</style><h1>RM Trading Academy — CSV Preparation</h1><p><a href="backtest.html">Backtester</a> · <a href="index.html">Dashboard</a></p><section><p>Choose a CSV file on your iPad or paste CSV text. The conversion runs locally in Safari.</p><input type="file" id="file" accept=".csv,.txt"><p>Or paste CSV:</p><textarea id="paste" placeholder="time,open,high,low,close,volume"></textarea><p><button id="check">Inspect CSV</button></p><p id="status"></p></section><section><h2>Inspection</h2><pre id="info">No data yet.</pre><label>Price divisor (only if verified): <select id="scale"><option value="1">1 — unchanged</option><option value="10000">10000</option><option value="100000">100000</option><option value="1000000">1000000</option></select></label><p><button id="download" disabled>Download normalized CSV</button></p><small>No prices are invented. Check timestamp order and price scaling against the source before testing.</small></section><script>
const $=id=>document.getElementById(id);let rows=[];
function parse(s){let lines=s.replace(/^\uFEFF/,'').replace(/\r/g,'').trim().split('\n').filter(Boolean);let h=lines.shift().split(',').map(x=>x.trim().replace(/"/g,'').toLowerCase().replace(/[^a-z0-9]/g,''));let idx=names=>h.findIndex(x=>names.includes(x));let cols=[idx(['time','datetime','timestamp','date']),idx(['open']),idx(['high']),idx(['low']),idx(['close']),idx(['volume','tickvolume','vol'])];if(cols.slice(0,5).some(x=>x<0))throw Error('Missing required columns. Found: '+h.join(', '));let bad=0;let out=lines.map(l=>{let v=l.split(',');return {time:v[cols[0]],open:+v[cols[1]],high:+v[cols[2]],low:+v[cols[3]],close:+v[cols[4]],volume:cols[5]<0?'':v[cols[5]]}}).filter(r=>{let valid=r.time&&[r.open,r.high,r.low,r.close].every(Number.isFinite)&&r.low<=Math.min(r.open,r.close)&&r.high>=Math.max(r.open,r.close);if(!valid)bad++;return valid});return {out,bad}}
$('check').onclick=async()=>{try{let f=$('file').files[0],s=f?await f.text():$('paste').value;let r=parse(s);if(!r.out.length)throw Error('No valid candles');rows=r.out;$('info').textContent=`Valid rows: ${rows.length}\nRejected rows: ${r.bad}\nFirst: ${rows[0].time}\nLast: ${rows[rows.length-1].time}\nFirst close: ${rows[0].close}\nLast close: ${rows[rows.length-1].close}`;$('download').disabled=false;$('status').textContent='Ready to export.'}catch(e){$('status').textContent=e.message;$('download').disabled=true}};
$('download').onclick=()=>{let d=+$('scale').value;let s='time,open,high,low,close,volume\n'+rows.map(r=>[r.time,...[r.open,r.high,r.low,r.close].map(x=>(x/d).toFixed(6)),r.volume].join(',')).join('\n');let url=URL.createObjectURL(new Blob([s],{type:'text/csv'}));let a=document.createElement('a');a.href=url;a.download='EURUSD_M15_normalized.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
</script></html>
